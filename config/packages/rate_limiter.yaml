framework:
    rate_limiter:
        digest:
            policy: sliding_window
            limit: 10
            interval: '1 minute'
            cache_pool: cache.digest_limiter
        ingest:
            policy: sliding_window
            limit: '%env(int:INGEST_RATE_LIMIT)%'
            interval: '1 minute'
            cache_pool: cache.ingest_limiter
        anonymous:
            policy: sliding_window
            limit: '%env(int:ANONYMOUS_RATE_LIMIT)%'
            interval: '1 minute'
            cache_pool: cache.anonymous_limiter

    cache:
        pools:
            cache.digest_limiter:
                adapter: cache.app
            cache.ingest_limiter:
                adapter: cache.app
            cache.anonymous_limiter:
                adapter: cache.app

when@test:
    framework:
        cache:
            pools:
                cache.anonymous_limiter:
                    adapter: cache.adapter.array
