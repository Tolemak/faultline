services:
  app:
    build:
      context: .
      dockerfile: container/dev/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-faultline}:${POSTGRES_PASSWORD:-faultline}@db:5432/${POSTGRES_DB:-faultline}?serverVersion=18&charset=utf8"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - .:/app

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faultline}
      POSTGRES_USER: ${POSTGRES_USER:-faultline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faultline}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-faultline}", "-U", "${POSTGRES_USER:-faultline}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
