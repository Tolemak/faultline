version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ["*"]
      composer:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      github-actions:
        patterns: ['*']
