name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: faultline_test
          POSTGRES_USER: faultline
          POSTGRES_PASSWORD: faultline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faultline -d faultline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://faultline:faultline@127.0.0.1:5432/faultline?serverVersion=18&charset=utf8

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip
          coverage: pcov
          tools: composer:v2

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate composer files
        run: composer validate --strict --no-check-publish

      - name: Audit dependencies
        run: composer audit

      - name: Coding standard
        run: vendor/bin/php-cs-fixer check --diff

      - name: Lint configuration and templates
        run: |
          php bin/console lint:yaml config translations --no-interaction
          php bin/console lint:twig templates --no-interaction
          php bin/console lint:container --no-interaction

      - name: Warm up dev container for PHPStan
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Prepare test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration
          php bin/console doctrine:schema:update --dump-sql --env=test
          php bin/console doctrine:schema:validate --env=test

      - name: Tests
        run: vendor/bin/phpunit --coverage-clover var/coverage/clover.xml

      - name: Coverage gate
        run: php bin/check-coverage.php var/coverage/clover.xml 80

  image:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/tolemak/faultline

    steps:
      - uses: actions/checkout@v5

      - name: Build the application image
        run: docker build -f container/Dockerfile -t faultline-base .

      - name: Build the runtime image
        run: >
          docker build --provenance=false -f container/Dockerfile.runtime
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" container

      - name: Smoke test the image
        run: |
          flags="--network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges:true --user 12345:12345 --tmpfs /run/apache2:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=12345,gid=12345 --tmpfs /run/lock/apache2:rw,noexec,nosuid,nodev,size=8m,mode=0700,uid=12345,gid=12345 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=12345,gid=12345"
          docker run --rm $flags "$IMAGE:${{ github.sha }}" sh -c 'php -m | grep -q pdo_pgsql && php -r "require \"/app/vendor/autoload.php\";" && test -r /app/composer.json && test ! -w /app/composer.json && . /etc/apache2/envvars && apache2 -t'
          docker run -d --name smoke $flags --tmpfs /app/var:rw,noexec,nosuid,nodev,size=64m,mode=0700,uid=12345,gid=12345 -e APP_SECRET="$(openssl rand -hex 16)" "$IMAGE:${{ github.sha }}"
          code=000
          for i in $(seq 1 30); do
            code=$(docker exec smoke php -r '$c = stream_context_create(["http" => ["ignore_errors" => true, "timeout" => 3]]); @file_get_contents("http://127.0.0.1:8080/health", false, $c); echo substr($http_response_header[0] ?? "000 000", 9, 3);' || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs smoke
          docker rm -f smoke
          test "$code" = 200

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push
        if: github.ref == 'refs/heads/main'
        id: push
        run: |
          docker push --quiet "$IMAGE:${{ github.sha }}"
          docker push --quiet "$IMAGE:latest"
          echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
