name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: faultline_test
          POSTGRES_USER: faultline
          POSTGRES_PASSWORD: faultline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faultline -d faultline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://faultline:faultline@127.0.0.1:5432/faultline?serverVersion=18&charset=utf8

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip
          coverage: pcov
          tools: composer:v2

      - name: Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies
        run: composer audit

      - name: Coding standard
        run: vendor/bin/php-cs-fixer check --diff

      - name: Warm up dev container for PHPStan
        run: php bin/console cache:warmup --env=dev

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Prepare test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: Tests
        run: vendor/bin/phpunit --coverage-clover var/coverage/clover.xml

      - name: Coverage gate
        run: php bin/check-coverage.php var/coverage/clover.xml 80
