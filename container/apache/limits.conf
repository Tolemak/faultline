ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 30
KeepAliveTimeout 2
MaxKeepAliveRequests 50

<IfModule mod_php.c>
    php_admin_value memory_limit ${FAULTLINE_PHP_MEMORY}
</IfModule>

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    MaxRequestWorkers 2
    MaxConnectionsPerChild 500
</IfModule>
