name: faultline

x-app: &app
  image: ${FAULTLINE_IMAGE:-faultline}:latest
  restart: unless-stopped
  init: true
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"
  security_opt:
    - no-new-privileges:true
  environment:
    APP_ENV: prod
    APP_DEBUG: "0"
    FAULTLINE_PHP_MEMORY: ${FAULTLINE_PHP_MEMORY:-96M}
    DATABASE_URL: "postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?serverVersion=18&charset=utf8"
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    build:
      context: ..
      dockerfile: container/Dockerfile
    ports:
      - "127.0.0.1:${FAULTLINE_PORT:?}:80"
    mem_limit: ${FAULTLINE_WEB_MEM:-160m}
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "php", "-r", "exit(false === @file_get_contents('http://127.0.0.1/health') ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    user: www-data
    command: ["php", "-d", "memory_limit=${FAULTLINE_WORKER_PHP_MEMORY:-64M}", "bin/console", "messenger:consume", "async", "--memory-limit=${FAULTLINE_WORKER_MEMORY_LIMIT:-48M}", "--time-limit=3600"]
    mem_limit: ${FAULTLINE_WORKER_MEM:-80m}
    cpus: 0.5
    pids_limit: 32
    healthcheck:
      disable: true

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_wal_size=256MB
      - -c
      - min_wal_size=48MB
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - autovacuum_max_workers=2
      - -c
      - io_method=sync
      - -c
      - jit=off
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:?}", "-U", "${POSTGRES_USER:?}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql
    mem_limit: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

volumes:
  db_data:
